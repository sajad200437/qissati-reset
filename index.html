<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استعادة كلمة المرور - قصتي</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101b35;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(85%, 360px);
      padding: 28px;
      border-radius: 18px;
      background: #1b2947;
      text-align: center;
    }
    h2 { color: #e5bd65; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 9px;
      border: 0;
      font-size: 16px;
    }
    button {
      background: #d8ad50;
      color: #101b35;
      font-weight: bold;
      cursor: pointer;
    }
    #message { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>قصتي</h2>
    <p>تعيين كلمة مرور جديدة</p>
    <input id="password" type="password" placeholder="كلمة المرور الجديدة">
    <input id="confirm" type="password" placeholder="تأكيد كلمة المرور">
    <button id="save">حفظ كلمة المرور</button>
    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://owwcuyvnzqfupdffdauq.supabase.co";
    const SUPABASE_KEY = sb_publishable_TPH5_h5rZEqQITVDm3MpOQ_r0-fiVT9

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    document.getElementById("save").onclick = async () => {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const message = document.getElementById("message");

      if (password.length < 8) {
        message.textContent = "كلمة المرور يجب أن تكون 8 أحرف على الأقل";
        return;
      }

      if (password !== confirm) {
        message.textContent = "كلمتا المرور غير متطابقتين";
        return;
      }

      message.textContent = "جارٍ الحفظ...";

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        message.textContent = "تعذر تغيير كلمة المرور: " + error.message;
      } else {
        message.textContent = "تم تغيير كلمة المرور بنجاح";
      }
    };
  </script>
</body>
</html>
